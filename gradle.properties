org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Minecraft / NeoForge（两值必须对应同一个 MC 版本）
minecraft_version=1.21.1
neo_version=21.1.248

# 依赖版本区间（neoforge.mods.toml 的 dependencies 用）
minecraft_version_range=[1.21.1]
neo_version_range=[21.1,)
northstar_version_range=[0.6.5,)
create_version_range=[6.0,)
geckolib_version_range=[4.7,5.0)

# Mod metadata（mod_id 与 @Mod 注解必须一致；FML 只允许小写字母、数字与下划线）
mod_id=northstar_planet_addon
mod_name=Northstar Planet Addon
mod_version=1.0.0
mod_group_id=com.suwako.northstarplanetaddon
mod_authors=Suwako, Vitran, Phosphoros Team
mod_license=All Rights Reserved
mod_description=One addon for Create Northstar Redux that brings the four planet addons together - Moon, Mercury, Mars and Venus - with new biomes, mobs, bosses, weather, machines and mechanics.
