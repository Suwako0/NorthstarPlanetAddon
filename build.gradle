// 北极星星球附属 / Northstar Planet Addon
// 把「北极星月球附属 / 水星附属 / 火星附属 / 金星附属（Create: Phosphoros）」合并成一个模组。
// NeoForge 21.1.x + Minecraft 1.21.1 + Java 21。
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    // 版本来自 gradle.properties（21.1.x 对应 MC 1.21.1）
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        // 无头验证：只跑本模组的 GameTest，避免把依赖模组的测试一起拉进来
        gameTestServer {
            type = 'gameTestServer'
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// runData 的产物和其它手写资源一起进 jar。
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // 开发运行用的联动模组（Northstar / Create / GeckoLib）从 Modrinth 取。
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'CreateMod'
        url = 'https://maven.createmod.net'
        content { includeGroup 'com.simibubi.create' }
    }
}

// ---------------------------------------------------------------------------
// 编译期 / 开发运行期的联动模组
//
// libs/ 里放的是整包 jar（northstar、create、flywheel、ponder、Registrate、geckolib），
// 只用 compileOnly + runtimeOnly：不会进发布 jar，也不会成为玩家的硬依赖声明。
// 代码层对它们的引用全部是注册名 / 标签 / 反射，所以缺一个也只是降级而不是编译失败
// （见 venus.compat 包）。
// ---------------------------------------------------------------------------
def linkJars = fileTree('libs') { include '*.jar' }
if (!linkJars.isEmpty()) {
    dependencies {
        compileOnly linkJars
        runtimeOnly linkJars
    }
}
logger.lifecycle("northstar_planet_addon: link jars on classpath = ${linkJars.files.size()}")

if (System.getProperty('os.name', '').toLowerCase(Locale.ROOT).contains('windows')) {
    // Windows 开发环境拿不到 netty 的 Linux 原生 epoll 分类器，排除掉避免解析失败。
    configurations.configureEach {
        exclude group: 'io.netty', module: 'netty-transport-native-epoll'
    }
}

// 只展开 neoforge.mods.toml 里的占位符；其它资源（含中文数据包 JSON）原样复制。
tasks.named('processResources') {
    var expandProps = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_license            : mod_license,
            mod_description        : mod_description,
            neo_version_range      : neo_version_range,
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            northstar_version_range: northstar_version_range,
            create_version_range   : create_version_range,
            geckolib_version_range : geckolib_version_range
    ]
    inputs.properties(expandProps)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(expandProps)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                // 生产环境从 jar 清单登记 Mixin 配置（开发环境走 mods.toml 的 [[mixins]]）
                'MixinConfigs'            : 'northstar_planet_addon.moon.mixins.json,northstar_planet_addon.mercury.mixins.json'
        ])
    }
}
